# Installed to ${PREFIX}/etc/containers/containers.conf.d/ by the podman recipe.
#
# podman is built with the `systemd` build tag (healthcheck timers). On hosts
# with a systemd journal that would also switch the default log driver and
# events backend to journald -- but the conda-forge `conmon` is built without
# journald support ("Include journald in compilation path to log to systemd
# journal"), so keep the non-systemd defaults for those two.

[containers]
log_driver = "k8s-file"

[engine]
events_logger = "file"
