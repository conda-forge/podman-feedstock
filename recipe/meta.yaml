{% set version = "5.8.3" %}

package:
  name: podman
  version: {{ version }}

source:
  url: https://github.com/containers/podman/archive/v{{ version }}.tar.gz
  sha256: c54a2ec4b4fb5577288992aaa78684397ec3552fb2d1234d910ec50097d05c0f
  folder: src/github.com/containers/podman
  patches:
    # NOTE: This adds the memfd_create syscall which is not available on CentOS 6's kernels.
    - 0001-Add-missing-defines-for-CentOS-6.patch   # [linux]
    # NOTE: If the patch for relative paths stops working, see the buildah
    #       feedstock for an alternative with an hardcoded prefix path.
    # NOTE: This patch uses Unix-style path logic (/usr prefix stripping) which
    #       is incompatible with Windows absolute paths; skip it on Windows.
    #       podman-remote on Windows connects to a remote service and does not
    #       need local container config from the conda prefix.
    - 0002-relative-paths-for-system-config-and-binaries.patch  # [not win]

build:
  number: 2

requirements:
  build:
    - {{ compiler('c') }}        # [linux]
    - {{ stdlib("c") }}          # [linux]
    - {{ compiler('go-cgo') }}   # [linux]
    - {{ compiler('go') }}       # [osx or win]
    # Instead specify the underlying packages since this isn't cross-platform
    - go-licenses >=0.0.44
    - go-md2man                  # [not win]
    - pkg-config                 # [linux]
    - make                       # [not win]
    - grep                       # [osx]
  host:
    - btrfs-progs                # [linux]
    - containers-common          # [not win]
    - glib                       # [linux]
    # Header+pkgconfig files for libglib are in the glib package.
    - libglib                    # [linux]
    - gpgme                      # [linux]
    - libassuan                  # [linux]
    - libgpg-error               # [linux]
    - libseccomp                 # [linux]
    # podman links libsqlite3 (`libsqlite3` build tag, sqlite database backend);
    # without this host dep the package silently relied on the system library.
    - libsqlite                  # [linux]
    # Enables the `systemd` build tag (auto-detected by hack/systemd_tag.sh):
    # healthcheck timers via systemd-run and journald events/log driver.
    # All of it is runtime-gated on a running systemd (/run/systemd/system),
    # so hosts without systemd keep the previous behaviour. On systemd hosts
    # *without* a user session (e.g. `su - user`, no lingering), containers
    # with a HEALTHCHECK then fail to start unless DISABLE_HC_SYSTEMD=true or
    # `loginctl enable-linger` -- same as distribution podman packages.
    - libsystemd                 # [linux]
  run:
    - conmon >=2.0.30            # [linux]
    - containers-common          # [not win]
    - cni-plugins                # [linux]
    # TODO: switch to crun?
    - runc                       # [linux]
    - netavark                   # [linux]
    # DNS for containers on user-defined networks (netavark hands off to it).
    # Without it, `podman network create` works but names never resolve.
    # NOTE: aardvark-dns and passt are currently only built for linux-64;
    #       once their feedstocks add the other Linux platforms these
    #       selectors should become `# [linux]`.
    - aardvark-dns               # [linux64]
    # Rootless networking: podman >=5 defaults to pasta and refuses to start
    # rootless containers if it is missing ("could not find pasta").
    - passt                      # [linux64]
    - slirp4netns                # [linux]

test:
  requires:
    # NOTE: Some binaries from util-linux, like `nsenter`, are needed. To avoid
    #       clashes with users' system-provided base utils, let's not add
    #       util-linux to requirements/run for now.
    - util-linux                 # [linux]

about:
  home: https://podman.io/
  dev_url: https://github.com/containers/podman
  doc_url: https://docs.podman.io/en/latest/
  license: Apache-2.0
  license_family: Apache
  license_file:
    - src/github.com/containers/podman/LICENSE
    - license-files/
  summary: 'Podman: A tool for managing OCI containers and pods.'
  description: >
    Podman (the POD MANager) is a tool for managing containers and images, volumes mounted into those containers, and pods made from groups of containers. Podman is based on libpod, a library for container lifecycle management that is also contained in this repository. The libpod library provides APIs for managing containers,
    pods, container images, and volumes.

extra:
  recipe-maintainers:
    - mbargull
    - dhirschfeld
    - manics
    - xhochy
