bot:
  automerge: true
build_platform:
  linux_aarch64: linux_64
  linux_ppc64le: linux_64
conda_build:
  pkg_format: '2'
conda_forge_output_validation: true
github:
  branch_name: main
  tooling_branch_name: main
provider:
  linux_64: azure
  win_64: azure
  osx_arm64: default
test: native_and_emulated
workflow_settings:
  store_build_artifacts: true
docker:
  run_args: --cap-add SYS_ADMIN
